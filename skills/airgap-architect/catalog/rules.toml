# Thresholds, escalators and defaults for airgap-architect.
#
# Every constant is a table with `value`, `evidence` and `notes`.
#   evidence = "field"    also needs `verified_by`
#   evidence = "docs"     also needs `sources` (list of URLs)
#   evidence = "estimate" needs `notes` stating the basis
# A constant's ID is its table path, for example `tiers.t1_max_users`.

schema_version = 1

# --- Base tier (design spec section 8.1) ------------------------------------

[tiers.t1_max_users]
value = 50
evidence = "docs"
sources = [
  "https://docs.openwebui.com/license/",
  "https://docs.openwebui.com/getting-started/advanced-topics/scaling",
  "https://single-market-economy.ec.europa.eu/smes/sme-fundamentals/sme-definition_en",
]
notes = "Three anchors converge on 50. The Open WebUI licence allows changing its branding with '50 or fewer users in a 30-day period'. The Open WebUI scaling guide has a row 'Small team (< 50 users, single instance)'. The EU SME definition counts a small enterprise as fewer than 50 staff. No source found uses 25. Replace with field data when available. (research 2026-11-21)"

[tiers.t2_max_users]
value = 300
evidence = "docs"
sources = [
  "https://learn.microsoft.com/en-us/office365/servicedescriptions/office-365-platform-service-description/office-365-plan-options",
  "https://workspace.google.com/pricing",
]
notes = "Product-segmentation line, used as the start of enterprise IT needs: Microsoft 365 business plans are 'designed for organizations with up to 300 users' and Google Workspace business plans have a 'maximum of 300 users'. The EU medium-enterprise line is 250 (https://single-market-economy.ec.europa.eu/smes/sme-fundamentals/sme-definition_en). Not a high-availability trigger: GitLab recommends HA from 3,000 users and Open WebUI calls 1,000+ users large scale. (research 2026-11-21)"

[tiers.t1_max_departments]
value = 1
evidence = "estimate"
notes = "Heuristic. No source found on 2026-11-21 uses a number of departments as a size boundary. Replace with field data. (research 2026-11-21)"

[tiers.t2_max_departments]
value = 5
evidence = "estimate"
notes = "Heuristic. No source found on 2026-11-21 uses a number of departments as a size boundary. Replace with field data. (research 2026-11-21)"

# --- Escalators (design spec section 8.2) -----------------------------------
# An escalator applies when answers[answer] == equals. It raises the listed
# floors to at least the given tier and switches the listed requirements on.

[[escalators]]
id = "audit"
answer = "org.audit_required"
equals = true
floors = { "llm-gateway" = "T2" }
requires = ["gateway_non_empty"]
reason = "org.audit_required sets the llm-gateway floor to at least T2 and requires a gateway"
evidence = "estimate"
notes = "Design spec section 8.2."

[[escalators]]
id = "isolation-per-department"
answer = "org.isolation"
equals = "per_department"
floors = { "llm-gateway" = "T2", "identity" = "T2" }
requires = ["gateway_non_empty"]
reason = "org.isolation = per_department sets the llm-gateway and identity floors to at least T2 and requires a gateway"
evidence = "estimate"
notes = "Design spec section 8.2."

[[escalators]]
id = "isolation-multi-level"
answer = "org.isolation"
equals = "multi_level"
floors = { "llm-gateway" = "T3", "identity" = "T3" }
requires = ["gateway_non_empty", "isolation_design_section"]
reason = "org.isolation = multi_level sets the llm-gateway and identity floors to T3, requires a gateway and an Isolation design subsection"
evidence = "estimate"
notes = "Design spec section 8.2. The gateway requirement follows from section 9.2 (isolation other than none)."

[[escalators]]
id = "no-downtime"
answer = "org.downtime_tolerance"
equals = "none"
floors = { "orchestration" = "T3", "llm-serving" = "T3", "state" = "T3" }
requires = ["two_engine_replicas"]
reason = "org.downtime_tolerance = none sets the orchestration, llm-serving and state floors to T3 and requires at least two engine replicas"
evidence = "estimate"
notes = "Design spec section 8.2."

# --- Concurrency (design spec section 10.1) ---------------------------------

[sizing.chat.active]
value = 0.20
evidence = "estimate"
notes = "Share of users active in the peak hour. Unmeasured. No source measures the share of users active in the peak hour; only active x duty is anchored (see duty_low and duty_high). (research 2026-11-21)"

[sizing.chat.duty_low]
value = 0.25
evidence = "estimate"
notes = "Share of time an active user has a request in flight, low end. Set so that active x duty = 5 % of users in flight, the lowest row of the sensitivity table in NVIDIA's RAG sizing guide (https://docs.nvidia.com/enterprise-reference-architectures/enterprise-rag-retrieval-scaling-and-sizing-guide/latest/rag-sizing-guidelines.html). The factor alone is unmeasured. (research 2026-11-21)"

[sizing.chat.duty_high]
value = 0.50
evidence = "estimate"
notes = "Share of time an active user has a request in flight, high end. Set so that active x duty = 10 % of users in flight; NVIDIA's RAG sizing guide says 'a good estimate of peak usage for the Chat service is 10% of total users' (https://docs.nvidia.com/enterprise-reference-architectures/enterprise-rag-retrieval-scaling-and-sizing-guide/latest/rag-sizing-guidelines.html). The factor alone is unmeasured. (research 2026-11-21)"

[sizing.rag.active]
value = 0.20
evidence = "estimate"
notes = "Share of users active in the peak hour. Unmeasured. No source measures the share of users active in the peak hour; only active x duty is anchored (see duty_low and duty_high). (research 2026-11-21)"

[sizing.rag.duty_low]
value = 0.25
evidence = "estimate"
notes = "Share of time an active user has a request in flight, low end. Set so that active x duty = 5 % of users in flight, the lowest row of the sensitivity table in NVIDIA's RAG sizing guide (https://docs.nvidia.com/enterprise-reference-architectures/enterprise-rag-retrieval-scaling-and-sizing-guide/latest/rag-sizing-guidelines.html). The factor alone is unmeasured. (research 2026-11-21)"

[sizing.rag.duty_high]
value = 0.50
evidence = "estimate"
notes = "Share of time an active user has a request in flight, high end. Set so that active x duty = 10 % of users in flight; NVIDIA's RAG sizing guide says 'a good estimate of peak usage for the Chat service is 10% of total users' (https://docs.nvidia.com/enterprise-reference-architectures/enterprise-rag-retrieval-scaling-and-sizing-guide/latest/rag-sizing-guidelines.html). The factor alone is unmeasured. (research 2026-11-21)"

[sizing.code_assistant.active]
value = 0.30
evidence = "estimate"
notes = "Share of users active in the peak hour. Unsourced. (research 2026-11-21)"

[sizing.code_assistant.duty_low]
value = 0.70
evidence = "estimate"
notes = "Share of time an active user has a request in flight, low end. Models agentic coding tools that keep a request in flight most of the time; unsourced. Contradicted for inline completion: GitHub telemetry gives 158 completion opportunities per active hour (https://arxiv.org/pdf/2205.06537), a duty of a few percent. (research 2026-11-21)"

[sizing.code_assistant.duty_high]
value = 1.00
evidence = "estimate"
notes = "Share of time an active user has a request in flight, high end. Models agentic coding tools that keep a request in flight most of the time; unsourced. Contradicted for inline completion: GitHub telemetry gives 158 completion opportunities per active hour (https://arxiv.org/pdf/2205.06537), a duty of a few percent. (research 2026-11-21)"

# --- Memory (design spec section 10.2) --------------------------------------

[sizing.bytes_per_param.fp32]
value = 4
evidence = "estimate"
notes = "Arithmetic: 32 bits per parameter."

[sizing.bytes_per_param.bf16]
value = 2
evidence = "estimate"
notes = "Arithmetic: 16 bits per parameter."

[sizing.bytes_per_param.fp16]
value = 2
evidence = "estimate"
notes = "Arithmetic: 16 bits per parameter."

[sizing.bytes_per_param.fp8]
value = 1
evidence = "estimate"
notes = "Arithmetic: 8 bits per parameter."

[sizing.bytes_per_param.int8]
value = 1
evidence = "estimate"
notes = "Arithmetic: 8 bits per parameter."

[sizing.bytes_per_param.int4]
value = 0.5
evidence = "estimate"
notes = "Arithmetic: 4 bits per parameter; ignores quantization metadata."

[sizing.gpu_memory_utilization]
value = 0.90
evidence = "estimate"
notes = "Share of GPU memory the engine may use. Starting default from the design spec. Not the documented default: vLLM v0.34.0 documents 1.0 on CUDA and ROCm (extensible KV cache, leave unset) and 0.92 elsewhere, and says a lower value takes memory away from the KV cache. 0.90 is kept as the design spec's starting value, below the engine's documented default; changing it needs a spec change. Source: https://github.com/vllm-project/vllm/blob/v0.34.0/docs/configuration/optimization.md (section GPU Memory Utilization) and https://github.com/vllm-project/vllm/blob/v0.34.0/vllm/config/cache.py."

[sizing.overhead]
value = 0.10
evidence = "estimate"
notes = "Extra memory on top of the weights. Starting default from the design spec."

[sizing.gpu_group_sizes]
value = [1, 2, 4, 8]
evidence = "estimate"
notes = "GPU counts one replica may span. Starting default from the design spec. vLLM v0.34.0 documents no constraint to 1, 2, 4 or 8: it accepts any tensor_parallel_size and says that when the GPU count does not divide the model evenly, pipeline parallelism supports uneven splits. The list stays an estimate (common server sizes). Source: https://github.com/vllm-project/vllm/blob/v0.34.0/docs/serving/parallelism_scaling.md."

[sizing.default_precision]
value = "bf16"
evidence = "estimate"
notes = "Used when a model is given as a size class without a precision. Unquantized, so sizing errs on the large side."

[sizing.default_context_tokens]
value = 8192
evidence = "estimate"
notes = "Used when a model entry has no context_tokens. Chosen by the implementation plan, not measured."

[sizing.default_output_tokens]
value = 1024
evidence = "estimate"
notes = "Tokens generated per request for KV-cache sizing. Chosen by the implementation plan, not measured."

[sizing.default_kv_dtype]
value = "fp16"
evidence = "estimate"
notes = "KV-cache element type when the architecture numbers do not state one."

[sizing.size_class.S]
value = 8
evidence = "estimate"
notes = "Representative parameter count in billions for class S (up to 15B)."

[sizing.size_class.M]
value = 32
evidence = "estimate"
notes = "Representative parameter count in billions for class M (16B to 80B)."

[sizing.size_class.L]
value = 120
evidence = "estimate"
notes = "Representative parameter count in billions for class L (81B to 300B)."

[sizing.size_class.XL]
value = 671
evidence = "estimate"
notes = "Representative parameter count in billions for class XL (above 300B)."

# --- Totals (design spec section 10.3) --------------------------------------

[sizing.gpus_per_server]
value = 8
evidence = "estimate"
notes = "GPUs per server chassis. Starting default from the design spec."

[sizing.power_system_factor]
value = 1.8
evidence = "estimate"
notes = "Whole-system power divided by GPU power. Starting default from the design spec."

[sizing.ha_min_replicas]
value = 2
evidence = "estimate"
notes = "Minimum engine replicas when no downtime is accepted. Design spec section 10.2."

# --- Lint --------------------------------------------------------------------

[lint.freshness_days]
value = 180
evidence = "estimate"
notes = "Catalog entries older than this trigger warning W1. Design spec section 11.3."

# --- Defaults for answers given as "unknown" (design spec section 7) ---------
# No default exists for org.users_total, org.departments, workload.models and
# hardware.gpus: those must be answered.

[defaults.org.isolation]
value = "per_department"
evidence = "estimate"
notes = "Unknown privacy rules are treated as the stricter common case."

[defaults.org.audit_required]
value = true
evidence = "estimate"
notes = "Unknown audit rules are treated as required."

[defaults.org.downtime_tolerance]
value = "planned_only"
evidence = "estimate"
notes = "Middle option."

[defaults.org.ops_capacity]
value = "part_time_one"
evidence = "estimate"
notes = "Smallest operating capacity, so the design stays simple."

[defaults.org.kubernetes_experience]
value = false
evidence = "estimate"
notes = "Kubernetes experience is not assumed."

[defaults.workload.usage]
value = { chat = 1.0 }
evidence = "estimate"
notes = "Chat only."

[defaults.existing.identity]
value = "none"
evidence = "estimate"
notes = "No existing infrastructure is assumed."

[defaults.existing.api_gateway]
value = "none"
evidence = "estimate"
notes = "No existing infrastructure is assumed."

[defaults.existing.kubernetes]
value = "none"
evidence = "estimate"
notes = "No existing infrastructure is assumed."

[defaults.transfer.channel]
value = "removable_media"
evidence = "estimate"
notes = "The most restrictive common transfer channel."
