schema_version = 2
id = "vllm"
name = "vLLM"
layer = "llm-serving"
summary = "High-throughput inference and serving engine for large language models that batches incoming requests continuously and exposes an OpenAI-compatible HTTP server."
tiers = ["T1", "T2", "T3"]
requires = []
version = "v0.34.0"
license = "Apache-2.0"
last_verified = 2026-11-22

