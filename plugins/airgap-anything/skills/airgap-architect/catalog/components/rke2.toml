id = "rke2"
name = "RKE2"
layer = "orchestration"
summary = "Rancher's security-focused Kubernetes distribution that runs the control plane as static pods with an embedded containerd and has a documented air-gap installation."
tiers = ["T1", "T2", "T3"]
requires = []
version = "v1.37.2+rke2r1"
license = "Apache-2.0"
last_verified = 2026-11-22

