id = "k3s"
name = "K3s"
layer = "orchestration"
summary = "Lightweight, fully conformant Kubernetes distribution that ships as a single binary with containerd and a set of packaged add-ons, and has a documented air-gap installation."
tiers = ["T1", "T2"]
