[[gpu]]
model = "B200"
aliases = ["NVIDIA B200"]
vendor = "nvidia"
vram_gb = 180
tdp_w = 1000
evidence = "docs"
sources = [
  "https://docs.nvidia.com/enterprise-reference-architectures/hgx-ai-factory/latest/components.html",
  "https://images.nvidia.com/aem-dam/Solutions/documents/HGX-B200-PCF-Summary.pdf",
]
notes = "HGX B200 reference table: memory per GPU 180GB HBM3e. HGX B200 summary: each B200 GPU has 180 GB, max thermal design power per individual GPU configurable up to 1000 W. NVIDIA's Blackwell Ultra developer blog table lists 192 GB as the Blackwell chip maximum; the product figure is used here."
last_verified = 2026-11-22

[[gpu]]
model = "B300"
aliases = ["NVIDIA B300"]
vendor = "nvidia"
vram_gb = 288
evidence = "docs"
sources = [
  "https://docs.nvidia.com/enterprise-reference-architectures/hgx-ai-factory/latest/components.html",
  "https://docs.nvidia.com/dgx/dgxb300-user-guide/introduction-to-dgxb300.html",
  "https://developer.nvidia.com/blog/inside-nvidia-blackwell-ultra-the-chip-powering-the-ai-factory-era/",
]
notes = "NVIDIA states 288 GB per GPU in three places: the developer blog 'Inside NVIDIA Blackwell Ultra' ('With 288 GB of HBM3e per GPU'), the HGX reference table (memory per GPU 288GB HBM3e; Table 2: up to 2304 GB per eight-GPU baseboard) and the DGX B300 user guide (8 x 288 GB = 2.3 TB). The blog footnote says 'Blackwell Ultra GPUs contain up to 160 SMs and 288GB HBM3E Memory. Available SM count and HBM capacity varies by SKU', so 288 is a maximum: confirm the part. The HGX and DGX B300 product pages state only 2.1 TB total. 8 x 288 GB = 2,304 GB, which is about 2.1 TiB, so that figure may be in binary units; no NVIDIA page confirms this reading. No per-GPU power figure found on a product or documentation page, so tdp_w is left out."
last_verified = 2026-11-22

