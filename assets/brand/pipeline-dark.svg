<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" width="1280" height="540" role="img" aria-labelledby="title desc">
  <title id="title">How airgap-architect works</title>
  <desc id="desc">Eight steps run on a connected workstation: interview, tier, sizing, decisions, manifest, blueprint, lint, hand-off. The result is checked and carried across the air gap, and the system is built inside without internet.</desc>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .name { font-size: 23px; font-weight: 650; }
    .sub { font-size: 16px; }
    .zone { font-size: 19px; font-weight: 600; fill: #9AA1A9; }
    .lit, .blk, .ok { opacity: 0; animation-duration: 16s; animation-iteration-count: infinite; animation-timing-function: linear; }
    .l0 { animation-name: l0; } @keyframes l0 { 0%, 2.5% { opacity: 0; } 3.8%, 10% { opacity: 1; } 11.2%, 100% { opacity: 0; } }
    .l1 { animation-name: l1; } @keyframes l1 { 0%, 10% { opacity: 0; } 11.2%, 17.5% { opacity: 1; } 18.8%, 100% { opacity: 0; } }
    .l2 { animation-name: l2; } @keyframes l2 { 0%, 17.5% { opacity: 0; } 18.8%, 25% { opacity: 1; } 26.2%, 100% { opacity: 0; } }
    .l3 { animation-name: l3; } @keyframes l3 { 0%, 25% { opacity: 0; } 26.2%, 32.5% { opacity: 1; } 33.8%, 100% { opacity: 0; } }
    .l4 { animation-name: l4; } @keyframes l4 { 0%, 32.5% { opacity: 0; } 33.8%, 40% { opacity: 1; } 41.2%, 100% { opacity: 0; } }
    .l5 { animation-name: l5; } @keyframes l5 { 0%, 40% { opacity: 0; } 41.2%, 47.5% { opacity: 1; } 48.8%, 100% { opacity: 0; } }
    .l6 { animation-name: l6; } @keyframes l6 { 0%, 47.5% { opacity: 0; } 48.8%, 55% { opacity: 1; } 56.2%, 100% { opacity: 0; } }
    .l7 { animation-name: l7; } @keyframes l7 { 0%, 55% { opacity: 0; } 56.2%, 62.5% { opacity: 1; } 63.7%, 100% { opacity: 0; } }
    .b1 { animation-name: b1; } @keyframes b1 { 0%, 62.5% { transform: translateX(0); opacity: 0; } 63.7% { opacity: 1; } 68.8%, 76.2% { transform: translateX(47px); opacity: 1; } 78.1%, 100% { transform: translateX(47px); opacity: 0; } }
    .ok { animation-name: ok; } @keyframes ok { 0%, 70% { opacity: 0; } 71.9%, 76.9% { opacity: 1; } 78.8%, 100% { opacity: 0; } }
    .b2 { animation-name: b2; } @keyframes b2 { 0%, 77.5% { transform: translateX(0); opacity: 0; } 79.4% { opacity: 1; } 84.4% { transform: translateX(34px); opacity: 1; } 86.9%, 100% { transform: translateX(34px); opacity: 0; } }
    .lin { animation-name: lin; } @keyframes lin { 0%, 84.4% { opacity: 0; } 86.2%, 96.2% { opacity: 1; } 98.1%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .lit, .blk, .ok { animation: none; } }
  </style>
  <text class="zone" x="48" y="62">Outside: a connected workstation</text><text class="zone" x="1024" y="62">Inside</text>
  <g><rect x="49" y="113" width="194" height="94" rx="9" fill="none" stroke="#F2F3F5" stroke-width="2"/><text class="name" x="68" y="155" fill="#F2F3F5">1 Interview</text><text class="sub" x="68" y="183" fill="#9AA1A9">the model asks</text><rect class="lit l0" x="48" y="218" width="196" height="6" rx="3" fill="#FFC800"/></g>
  <g><rect x="268" y="112" width="196" height="96" rx="10" fill="#F2F3F5"/><text class="name" x="288" y="155" fill="#0D1117">2 Tier</text><text class="sub" x="288" y="183" fill="#5F6368">a script computes</text><rect class="lit l1" x="268" y="218" width="196" height="6" rx="3" fill="#FFC800"/></g>
  <g><rect x="488" y="112" width="196" height="96" rx="10" fill="#F2F3F5"/><text class="name" x="508" y="155" fill="#0D1117">3 Sizing</text><text class="sub" x="508" y="183" fill="#5F6368">a script computes</text><rect class="lit l2" x="488" y="218" width="196" height="6" rx="3" fill="#FFC800"/></g>
  <g><rect x="709" y="113" width="194" height="94" rx="9" fill="none" stroke="#F2F3F5" stroke-width="2"/><text class="name" x="728" y="155" fill="#F2F3F5">4 Decisions</text><text class="sub" x="728" y="183" fill="#9AA1A9">the model chooses</text><rect class="lit l3" x="708" y="218" width="196" height="6" rx="3" fill="#FFC800"/></g>
  <g><rect x="48" y="300" width="196" height="96" rx="10" fill="#F2F3F5"/><text class="name" x="68" y="343" fill="#0D1117">5 Manifest</text><text class="sub" x="68" y="371" fill="#5F6368">a script lists</text><rect class="lit l4" x="48" y="406" width="196" height="6" rx="3" fill="#FFC800"/></g>
  <g><rect x="269" y="301" width="194" height="94" rx="9" fill="none" stroke="#F2F3F5" stroke-width="2"/><text class="name" x="288" y="343" fill="#F2F3F5">6 Blueprint</text><text class="sub" x="288" y="371" fill="#9AA1A9">the model writes</text><rect class="lit l5" x="268" y="406" width="196" height="6" rx="3" fill="#FFC800"/></g>
  <g><rect x="488" y="300" width="196" height="96" rx="10" fill="#F2F3F5"/><text class="name" x="508" y="343" fill="#0D1117">7 Lint</text><text class="sub" x="508" y="371" fill="#5F6368">a script verifies</text><rect class="lit l6" x="488" y="406" width="196" height="6" rx="3" fill="#FFC800"/></g>
  <g><rect x="709" y="301" width="194" height="94" rx="9" fill="none" stroke="#F2F3F5" stroke-width="2"/><text class="name" x="728" y="343" fill="#F2F3F5">8 Hand-off</text><text class="sub" x="728" y="371" fill="#9AA1A9">after you approve</text><rect class="lit l7" x="708" y="406" width="196" height="6" rx="3" fill="#FFC800"/></g>
