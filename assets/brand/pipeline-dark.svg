  <rect x="1025" y="113" width="206" height="282" rx="9" fill="none" stroke="#F2F3F5" stroke-width="2"/><path fill="#F2F3F5" transform="translate(1044 134) scale(0.3)" d="M108 30H148L240 214H200L128 70L56 214H16ZM82 140H112V172H66ZM144 140H174L190 172H144Z"/><text class="name" x="1044" y="248" fill="#F2F3F5">Build</text><text class="sub" x="1044" y="278" fill="#9AA1A9">no internet,</text><text class="sub" x="1044" y="300" fill="#9AA1A9">by the blueprint</text><rect class="lit lin" x="1024" y="406" width="208" height="6" rx="3" fill="#FFC800"/>
  <rect class="blk b1" x="912" y="339.0" width="18" height="18" fill="#FFC800"/><path class="ok" d="M959 314.0l6 6l12 -13" stroke="#F2F3F5" stroke-width="3" fill="none"/><rect class="blk b2" x="1004" y="339.0" width="18" height="18" fill="#FFC800"/>
